<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>송파점 영업 대시보드</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root {
    --accent: #3b82f6;
    --accent-soft: rgba(59,130,246,0.16);
    --bg: #0b0b0f;
    --sidebar-bg: #111116;
    --card-bg: #16161d;
    --card-border: rgba(255,255,255,0.07);
    --text-primary: #f5f5f7;
    --text-secondary: #9a9aa5;
    --text-muted: #6b6b76;
    --grid: rgba(255,255,255,0.08);
    --good: #22c55e;
    --bad: #ef4444;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text-primary); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing:antialiased; }
  .app { display: flex; min-height: 100vh; }
  .sidebar { width: 220px; flex-shrink: 0; background: var(--sidebar-bg); border-right: 1px solid var(--card-border); padding: 20px 14px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 6px 8px 20px; }
  .brand-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
  .brand-title { font-size: 14px; font-weight: 700; }
  .brand-sub { font-size: 10px; color: var(--text-muted); letter-spacing: 0.05em; }
  .nav-label { font-size: 10px; color: var(--text-muted); padding: 14px 8px 6px; letter-spacing: 0.05em; }
  .nav-item { display: block; padding: 8px 8px; border-radius: 8px; color: var(--text-secondary); text-decoration: none; font-size: 13px; margin-bottom: 2px; }
  .nav-item:hover { background: rgba(255,255,255,0.04); color: var(--text-primary); }
  .nav-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .sidebar-footer { margin-top: auto; padding: 12px 8px; font-size: 12px; color: var(--text-muted); border-top: 1px solid var(--card-border); }
  .content { flex: 1; padding: 28px 32px 60px; max-width: 1220px; }
  .content-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 22px; }
  .content-header h1 { font-size: 20px; margin: 0 0 4px; }
  .content-header .sub { color: var(--text-secondary); font-size: 13px; }
  .live-badge { font-size: 11px; color: var(--good); background: rgba(34,197,94,0.12); padding: 4px 10px; border-radius: 20px; }
  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .kpi { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; padding: 18px; }
  .kpi-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .kpi-label { font-size: 12px; color: var(--text-secondary); }
  .kpi-badge { font-size: 10px; color: var(--accent); background: var(--accent-soft); padding: 2px 8px; border-radius: 10px; }
  .kpi-value { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
  .kpi-unit { font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-left: 3px; }
  .kpi-sub { font-size: 12px; color: var(--text-muted); margin-top: 6px; }
  .kpi-sub b { color: var(--text-secondary); }
  .kpi-progress { height: 4px; background: rgba(255,255,255,0.08); border-radius: 4px; margin-top: 12px; overflow: hidden; }
  .kpi-progress-fill { height: 100%; background: var(--accent); border-radius: 4px; }
  .kpi-spark { margin-top: 10px; }
  .grid-2 { display: grid; grid-template-columns: 1.6fr 1fr; gap: 14px; margin-bottom: 20px; }
  @media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }
  .panel { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; padding: 20px; }
  .panel h2 { font-size: 13px; font-weight: 600; margin: 0 0 16px; color: var(--text-secondary); display: flex; justify-content: space-between; }
  .panel h2 .tag { font-size: 11px; color: var(--text-muted); font-weight: 400; }
  .bars { display: flex; align-items: flex-end; gap: 10px; height: 180px; padding-top: 10px; }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .bar-val { font-size: 10px; color: var(--text-muted); margin-bottom: 4px; }
  .bar-shape { width: 60%; border-radius: 4px 4px 0 0; background: var(--accent); }
  .bar-label { font-size: 11px; color: var(--text-muted); margin-top: 8px; }
  .donut-wrap { display: flex; align-items: center; gap: 18px; }
  .donut-legend { font-size: 12px; }
  .donut-legend-row { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .donut-legend-dot { width: 8px; height: 8px; border-radius: 50%; }
  .donut-legend-val { color: var(--text-muted); margin-left: auto; padding-left: 10px; }
  .list-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 900px) { .list-row { grid-template-columns: 1fr; } }
  .rank-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--grid); font-size: 13px; }
  .rank-row:last-child { border-bottom: none; }
  .rank-num { width: 20px; height: 20px; border-radius: 6px; background: rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--text-secondary); flex-shrink: 0; }
  .rank-row:first-child .rank-num { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
  .rank-name { width: 70px; flex-shrink: 0; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank-bar { flex: 1; height: 6px; background: rgba(255,255,255,0.06); border-radius: 4px; overflow: hidden; }
  .rank-bar-fill { height: 100%; background: var(--accent); border-radius: 4px; }
  .rank-value { width: 90px; text-align: right; font-weight: 600; flex-shrink: 0; }
  .loading, .error { color: var(--text-muted); font-size: 13px; padding: 30px; text-align: center; }
  .error { color: var(--bad); }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-dot"></span>
      <div><div class="brand-title">영업관리</div><div class="brand-sub">SALES OPS</div></div>
    </div>
    <div class="nav-label">현황</div>
    <a class="nav-item active" href="/">대시보드</a>
    <div class="nav-label">다른 대시보드</div>
    <a class="nav-item" href="/pl">손익</a>
    <a class="nav-item" href="/marketing">마케팅</a>
    <a class="nav-item" href="/customer">고객</a>
    <a class="nav-item" href="/hr">인사</a>
    <a class="nav-item" href="/exec">경영</a>
    <div class="sidebar-footer">송파점</div>
  </aside>

  <main class="content">
    <div class="content-header">
      <div>
        <h1>영업 대시보드</h1>
        <div class="sub" id="subtitle">불러오는 중...</div>
      </div>
      <span class="live-badge">● LIVE</span>
    </div>

    <div class="kpi-row" id="kpiRow"><div class="loading">불러오는 중...</div></div>

    <div class="grid-2">
      <div class="panel">
        <h2>월별 매출 vs 목표 <span class="tag">단위: 원</span></h2>
        <div id="barChart"><div class="loading">불러오는 중...</div></div>
      </div>
      <div class="panel">
        <h2>신상 vs 중고 매출 비중</h2>
        <div id="donutChart"><div class="loading">불러오는 중...</div></div>
      </div>
    </div>

    <div class="list-row">
      <div class="panel">
        <h2>담당자별 매출 <span class="tag">TOP 5 · 최근월</span></h2>
        <div id="sellerRank"><div class="loading">불러오는 중...</div></div>
      </div>
      <div class="panel">
        <h2>카테고리별 매출 <span class="tag">TOP 5 · 최근 2개월</span></h2>
        <div id="categoryRank"><div class="loading">불러오는 중...</div></div>
      </div>
    </div>
  </main>
</div>

<script>
const sb = supabase.createClient("https://gqmhzvpcurrlkobsgcov.supabase.co", "sb_publishable_f1qmdqH6SgUYfVRanU1tbQ_hTpjHJ_G");
const won = n => Math.round(n).toLocaleString("ko-KR");
const pct = n => (n * 100).toFixed(1) + "%";

function sparkline(values, color) {
  const w = 120, h = 32, max = Math.max(...values), min = Math.min(...values);
  const pts = values.map((v, i) => {
    const x = (i / (values.length - 1)) * w;
    const y = h - ((v - min) / (max - min || 1)) * h;
    return `${x},${y}`;
  }).join(" ");
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

async function main() {
  try {
    const [monthlyRes, rankRes, catRes, nuRes] = await Promise.all([
      sb.from("sales_monthly").select("*").order("sort_order"),
      sb.from("sales_rank").select("*").order("rank"),
      sb.from("sales_category").select("*").order("amt", { ascending: false }),
      sb.from("sales_newused").select("*"),
    ]);
    for (const r of [monthlyRes, rankRes, catRes, nuRes]) if (r.error) throw r.error;
    render(monthlyRes.data, rankRes.data, catRes.data, nuRes.data);
  } catch (e) {
    document.getElementById("kpiRow").innerHTML = `<div class="error">데이터를 불러오지 못했습니다: ${e.message || e}</div>`;
    console.error(e);
  }
}

function render(monthly, rank, cat, nu) {
  const totalRevenue = monthly.reduce((s, m) => s + Number(m.revenue), 0);
  const totalTarget = monthly.reduce((s, m) => s + Number(m.target || 0), 0);
  const achieveRate = totalTarget ? totalRevenue / totalTarget : 0;
  const last = monthly[monthly.length - 1];
  const prev = monthly[monthly.length - 2] || last;
  const lastAov = last.revenue / last.purchases;
  const prevAov = prev.revenue / prev.purchases;
  const aovChange = (lastAov - prevAov) / prevAov;
  const purchaseChange = (last.purchases - prev.purchases) / prev.purchases;
  const targetDiff = Number(last.target || 0) - Number(last.revenue);

  document.getElementById("subtitle").textContent =
    `${monthly[0].month} ~ ${last.month} · 실시간 집계`;

  document.getElementById("kpiRow").innerHTML = `
    <div class="kpi">
      <div class="kpi-top"><span class="kpi-label">${last.month} 매출</span><span class="kpi-badge">최근월</span></div>
      <div class="kpi-value">${won(last.revenue)}<span class="kpi-unit">원</span></div>
      <div class="kpi-sub">${targetDiff > 0 ? `목표까지 <b>${won(targetDiff)}원</b> 남음` : `목표 <b>${won(-targetDiff)}원</b> 초과 달성`}</div>
      <div class="kpi-progress"><div class="kpi-progress-fill" style="width:${Math.min(100, last.revenue / (last.target || last.revenue) * 100).toFixed(1)}%"></div></div>
    </div>
    <div class="kpi">
      <div class="kpi-top"><span class="kpi-label">목표 달성률</span><span class="kpi-badge">누적</span></div>
      <div class="kpi-value">${pct(achieveRate)}</div>
      <div class="kpi-sub">누적 매출 <b>${won(totalRevenue)}원</b></div>
      <div class="kpi-progress"><div class="kpi-progress-fill" style="width:${Math.min(100, achieveRate * 100).toFixed(1)}%"></div></div>
    </div>
    <div class="kpi">
      <div class="kpi-top"><span class="kpi-label">객단가</span><span class="kpi-badge">AOV</span></div>
      <div class="kpi-value">${won(lastAov)}<span class="kpi-unit">원</span></div>
      <div class="kpi-sub">${aovChange >= 0 ? "↑" : "↓"} ${pct(Math.abs(aovChange))} 전월 대비</div>
      <div class="kpi-spark">${sparkline(monthly.map(m => m.revenue / m.purchases), "#3b82f6")}</div>
    </div>
    <div class="kpi">
      <div class="kpi-top"><span class="kpi-label">구매건수</span><span class="kpi-badge">월간</span></div>
      <div class="kpi-value">${last.purchases}<span class="kpi-unit">건</span></div>
      <div class="kpi-sub">${purchaseChange >= 0 ? "↑" : "↓"} ${pct(Math.abs(purchaseChange))} 전월 대비</div>
      <div class="kpi-spark">${sparkline(monthly.map(m => m.purchases), "#3b82f6")}</div>
    </div>
  `;

  const maxRevenue = Math.max(...monthly.map(m => Number(m.revenue)), ...monthly.map(m => Number(m.target || 0)));
  document.getElementById("barChart").innerHTML = `
    <div class="bars">
      ${monthly.map(m => `
        <div class="bar-col">
          <div class="bar-val">${(m.revenue / 10000).toFixed(0)}만</div>
          <div class="bar-shape" style="height:${(m.revenue / maxRevenue * 100).toFixed(1)}%"></div>
          <div class="bar-label">${m.month}</div>
        </div>
      `).join("")}
    </div>
  `;

  const nuTotal = nu.reduce((s, x) => s + Number(x.amt), 0);
  const colors = { "신상": "#3b82f6", "중고": "#6366f1" };
  let angleAcc = 0;
  const segs = nu.map(x => {
    const frac = Number(x.amt) / nuTotal;
    const seg = { start: angleAcc, len: frac * 360, color: colors[x.type] || "#888" };
    angleAcc += frac * 360;
    return seg;
  });
  const r = 46, cx = 60, cy = 60;
  const arc = (start, len) => {
    const a1 = (start - 90) * Math.PI / 180, a2 = (start + len - 90) * Math.PI / 180;
    const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
    const x2 = cx + r * Math.cos(a2), y2 = cy + r * Math.sin(a2);
    const large = len > 180 ? 1 : 0;
    return `M${cx},${cy} L${x1.toFixed(2)},${y1.toFixed(2)} A${r},${r} 0 ${large} 1 ${x2.toFixed(2)},${y2.toFixed(2)} Z`;
  };
  document.getElementById("donutChart").innerHTML = `
    <div class="donut-wrap">
      <svg width="120" height="120" viewBox="0 0 120 120">
        ${segs.map(s => `<path d="${arc(s.start, s.len)}" fill="${s.color}"/>`).join("")}
        <circle cx="60" cy="60" r="26" fill="var(--card-bg)"/>
      </svg>
      <div class="donut-legend">
        ${nu.map(x => `
          <div class="donut-legend-row">
            <span class="donut-legend-dot" style="background:${colors[x.type]}"></span>
            ${x.type} <span class="donut-legend-val">${pct(Number(x.amt) / nuTotal)}</span>
          </div>
        `).join("")}
      </div>
    </div>
  `;

  const maxSeller = Math.max(...rank.filter(r => r.revenue > 0).map(r => Number(r.revenue)));
  document.getElementById("sellerRank").innerHTML = rank.filter(r => r.revenue > 0).slice(0, 5).map(r => `
    <div class="rank-row">
      <span class="rank-num">${r.rank}</span>
      <span class="rank-name">${r.seller}</span>
      <div class="rank-bar"><div class="rank-bar-fill" style="width:${(r.revenue / maxSeller * 100).toFixed(1)}%"></div></div>
      <span class="rank-value">${won(r.revenue)}원</span>
    </div>
  `).join("");

  const top5cat = cat.slice(0, 5);
  const maxCat = Math.max(...top5cat.map(c => Number(c.amt)));
  document.getElementById("categoryRank").innerHTML = top5cat.map((c, i) => `
    <div class="rank-row">
      <span class="rank-num">${i + 1}</span>
      <span class="rank-name">${c.category}</span>
      <div class="rank-bar"><div class="rank-bar-fill" style="width:${(c.amt / maxCat * 100).toFixed(1)}%"></div></div>
      <span class="rank-value">${won(c.amt)}원</span>
    </div>
  `).join("");
}

main();
</script>
</body>
</html>
