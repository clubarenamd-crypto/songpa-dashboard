<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>송파점 마케팅 대시보드</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root {
    --accent: #f97316;
    --accent-soft: rgba(249,115,22,0.16);
    --bg: #0b0b0f;
    --sidebar-bg: #111116;
    --card-bg: #16161d;
    --card-border: rgba(255,255,255,0.07);
    --text-primary: #f5f5f7;
    --text-secondary: #9a9aa5;
    --text-muted: #6b6b76;
    --grid: rgba(255,255,255,0.08);
    --good: #22c55e;
    --bad: #ef4444;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text-primary); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing:antialiased; }
  .app { display: flex; min-height: 100vh; }
  .sidebar { width: 220px; flex-shrink: 0; background: var(--sidebar-bg); border-right: 1px solid var(--card-border); padding: 20px 14px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 6px 8px 20px; }
  .brand-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
  .brand-title { font-size: 14px; font-weight: 700; }
  .brand-sub { font-size: 10px; color: var(--text-muted); letter-spacing: 0.05em; }
  .nav-label { font-size: 10px; color: var(--text-muted); padding: 14px 8px 6px; letter-spacing: 0.05em; }
  .nav-item { display: block; padding: 8px 8px; border-radius: 8px; color: var(--text-secondary); text-decoration: none; font-size: 13px; margin-bottom: 2px; }
  .nav-item:hover { background: rgba(255,255,255,0.04); color: var(--text-primary); }
  .nav-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .sidebar-footer { margin-top: auto; padding: 12px 8px; font-size: 12px; color: var(--text-muted); border-top: 1px solid var(--card-border); }
  .content { flex: 1; padding: 28px 32px 60px; max-width: 1220px; }
  .content-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 22px; }
  .content-header h1 { font-size: 20px; margin: 0 0 4px; }
  .content-header .sub { color: var(--text-secondary); font-size: 13px; }
  .live-badge { font-size: 11px; color: var(--good); background: rgba(34,197,94,0.12); padding: 4px 10px; border-radius: 20px; }
  .badge-warn { font-size: 11px; color: var(--accent); background: var(--accent-soft); padding: 4px 10px; border-radius: 20px; margin-left: 8px; }
  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .kpi { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; padding: 18px; }
  .kpi-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .kpi-label { font-size: 12px; color: var(--text-secondary); }
  .kpi-badge { font-size: 10px; color: var(--accent); background: var(--accent-soft); padding: 2px 8px; border-radius: 10px; }
  .kpi-value { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
  .kpi-unit { font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-left: 3px; }
  .kpi-sub { font-size: 12px; color: var(--text-muted); margin-top: 6px; }
  .grid-2 { display: grid; grid-template-columns: 1.6fr 1fr; gap: 14px; margin-bottom: 20px; }
  @media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }
  .panel { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; padding: 20px; }
  .panel h2 { font-size: 13px; font-weight: 600; margin: 0 0 16px; color: var(--text-secondary); display: flex; justify-content: space-between; }
  .panel h2 .tag { font-size: 11px; color: var(--text-muted); font-weight: 400; }
  .bars { display: flex; align-items: flex-end; gap: 10px; height: 180px; padding-top: 10px; }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .bar-val { font-size: 10px; color: var(--text-muted); margin-bottom: 4px; }
  .bar-shape { width: 60%; border-radius: 4px 4px 0 0; background: var(--accent); }
  .bar-label { font-size: 10px; color: var(--text-muted); margin-top: 8px; text-align: center; }
  .donut-wrap { display: flex; align-items: center; gap: 18px; }
  .donut-legend { font-size: 12px; }
  .donut-legend-row { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .donut-legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .donut-legend-val { color: var(--text-muted); margin-left: auto; padding-left: 10px; }
  .list-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px; }
  @media (max-width: 900px) { .list-row { grid-template-columns: 1fr; } }
  .rank-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--grid); font-size: 13px; }
  .rank-row:last-child { border-bottom: none; }
  .rank-num { width: 20px; height: 20px; border-radius: 6px; background: rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--text-secondary); flex-shrink: 0; }
  .rank-row:first-child .rank-num { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
  .rank-name { width: 110px; flex-shrink: 0; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank-bar { flex: 1; height: 6px; background: rgba(255,255,255,0.06); border-radius: 4px; overflow: hidden; }
  .rank-bar-fill { height: 100%; background: var(--accent); border-radius: 4px; }
  .rank-value { width: 90px; text-align: right; font-weight: 600; flex-shrink: 0; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: right; padding: 9px 8px; border-bottom: 1px solid var(--grid); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--text-muted); font-weight: 500; font-size: 12px; }
  .loading, .error { color: var(--text-muted); font-size: 13px; padding: 30px; text-align: center; }
  .error { color: var(--bad); }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-dot"></span>
      <div><div class="brand-title">마케팅관리</div><div class="brand-sub">MARKETING</div></div>
    </div>
    <div class="nav-label">현황</div>
    <a class="nav-item active" href="/marketing">대시보드</a>
    <div class="nav-label">다른 대시보드</div>
    <a class="nav-item" href="/">영업</a>
    <a class="nav-item" href="/pl">손익</a>
    <a class="nav-item" href="/customer">고객</a>
    <a class="nav-item" href="/hr">인사</a>
    <a class="nav-item" href="/exec">경영</a>
    <div class="sidebar-footer">송파점</div>
  </aside>

  <main class="content">
    <div class="content-header">
      <div>
        <h1>마케팅 대시보드</h1>
        <div class="sub" id="subtitle">불러오는 중...</div>
      </div>
      <div><span class="live-badge">● LIVE</span><span class="badge-warn">일부 샘플 데이터</span></div>
    </div>

    <div class="kpi-row" id="kpiRow"><div class="loading">불러오는 중...</div></div>

    <div class="grid-2">
      <div class="panel">
        <h2>채널별 매출 <span class="tag">단위: 원</span></h2>
        <div id="barChart"><div class="loading">불러오는 중...</div></div>
      </div>
      <div class="panel">
        <h2>채널별 매출 비중</h2>
        <div id="donutChart"><div class="loading">불러오는 중...</div></div>
      </div>
    </div>

    <div class="list-row">
      <div class="panel">
        <h2>전환수 순위 <span class="tag">채널별</span></h2>
        <div id="convRank"><div class="loading">불러오는 중...</div></div>
      </div>
      <div class="panel">
        <h2>전환당 비용 (CPA) <span class="tag">낮을수록 좋음</span></h2>
        <div id="cpaRank"><div class="loading">불러오는 중...</div></div>
      </div>
    </div>

    <div class="panel">
      <h2>채널별 상세</h2>
      <div id="channelTable"><div class="loading">불러오는 중...</div></div>
    </div>
  </main>
</div>

<script>
const sb = supabase.createClient("https://gqmhzvpcurrlkobsgcov.supabase.co", "sb_publishable_f1qmdqH6SgUYfVRanU1tbQ_hTpjHJ_G");
const won = n => Math.round(n).toLocaleString("ko-KR");
const pct = n => (n * 100).toFixed(1) + "%";
const PALETTE = ["#f97316", "#3b82f6", "#22c55e", "#a855f7", "#14b8a6", "#eab308"];

async function main() {
  try {
    const { data, error } = await sb.from("marketing_channel").select("*").order("sort_order");
    if (error) throw error;
    render(data);
  } catch (e) {
    document.getElementById("kpiRow").innerHTML = `<div class="error">데이터를 불러오지 못했습니다: ${e.message || e}</div>`;
    console.error(e);
  }
}

function render(rows) {
  const totalRevenue = rows.reduce((s, r) => s + Number(r.revenue), 0);
  const totalCost = rows.reduce((s, r) => s + Number(r.cost), 0);
  const totalVisitors = rows.reduce((s, r) => s + Number(r.visitors), 0);
  const totalConversions = rows.reduce((s, r) => s + Number(r.conversions), 0);
  const roas = totalCost ? totalRevenue / totalCost : 0;
  const cac = totalConversions ? totalCost / totalConversions : 0;

  document.getElementById("subtitle").textContent = "전 채널 통합 · 실시간 집계";

  document.getElementById("kpiRow").innerHTML = `
    <div class="kpi">
      <div class="kpi-top"><span class="kpi-label">총 광고비</span><span class="kpi-badge">누적</span></div>
      <div class="kpi-value">${won(totalCost)}<span class="kpi-unit">원</span></div>
      <div class="kpi-sub">채널 매출 합계 ${won(totalRevenue)}원</div>
    </div>
    <div class="kpi">
      <div class="kpi-top"><span class="kpi-label">통합 ROAS</span><span class="kpi-badge">종합</span></div>
      <div class="kpi-value">${roas.toFixed(1)}x</div>
      <div class="kpi-sub">광고비 대비 매출 배수</div>
    </div>
    <div class="kpi">
      <div class="kpi-top"><span class="kpi-label">CAC</span><span class="kpi-badge">평균</span></div>
      <div class="kpi-value">${won(cac)}<span class="kpi-unit">원</span></div>
      <div class="kpi-sub">전환 1건당 비용</div>
    </div>
    <div class="kpi">
      <div class="kpi-top"><span class="kpi-label">총 전환수</span><span class="kpi-badge">합계</span></div>
      <div class="kpi-value">${totalConversions}<span class="kpi-unit">건</span></div>
      <div class="kpi-sub">유입 ${totalVisitors.toLocaleString()}건 · 전환율 ${pct(totalConversions / totalVisitors)}</div>
    </div>
  `;

  const maxRev = Math.max(...rows.map(r => Number(r.revenue)));
  document.getElementById("barChart").innerHTML = `
    <div class="bars">
      ${rows.map((r, i) => `
        <div class="bar-col">
          <div class="bar-val">${(r.revenue / 10000).toFixed(0)}만</div>
          <div class="bar-shape" style="height:${(r.revenue / maxRev * 100).toFixed(1)}%;background:${PALETTE[i % PALETTE.length]}"></div>
          <div class="bar-label">${r.channel}</div>
        </div>
      `).join("")}
    </div>
  `;

  let angleAcc = 0;
  const segs = rows.map((r, i) => {
    const frac = Number(r.revenue) / totalRevenue;
    const seg = { start: angleAcc, len: frac * 360, color: PALETTE[i % PALETTE.length], label: r.channel, val: r.revenue };
    angleAcc += frac * 360;
    return seg;
  });
  const r = 46, cx = 60, cy = 60;
  const arc = (start, len) => {
    const a1 = (start - 90) * Math.PI / 180, a2 = (start + len - 90) * Math.PI / 180;
    const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
    const x2 = cx + r * Math.cos(a2), y2 = cy + r * Math.sin(a2);
    const large = len > 180 ? 1 : 0;
    return `M${cx},${cy} L${x1.toFixed(2)},${y1.toFixed(2)} A${r},${r} 0 ${large} 1 ${x2.toFixed(2)},${y2.toFixed(2)} Z`;
  };
  document.getElementById("donutChart").innerHTML = `
    <div class="donut-wrap">
      <svg width="120" height="120" viewBox="0 0 120 120">
        ${segs.map(s => `<path d="${arc(s.start, s.len)}" fill="${s.color}"/>`).join("")}
        <circle cx="60" cy="60" r="26" fill="var(--card-bg)"/>
      </svg>
      <div class="donut-legend">
        ${segs.map(s => `
          <div class="donut-legend-row">
            <span class="donut-legend-dot" style="background:${s.color}"></span>
            ${s.label} <span class="donut-legend-val">${pct(s.val / totalRevenue)}</span>
          </div>
        `).join("")}
      </div>
    </div>
  `;

  const byConv = [...rows].sort((a, b) => Number(b.conversions) - Number(a.conversions));
  const maxConv = Math.max(...byConv.map(r => Number(r.conversions)));
  document.getElementById("convRank").innerHTML = byConv.map((r, i) => `
    <div class="rank-row">
      <span class="rank-num">${i + 1}</span>
      <span class="rank-name">${r.channel}</span>
      <div class="rank-bar"><div class="rank-bar-fill" style="width:${(r.conversions / maxConv * 100).toFixed(1)}%"></div></div>
      <span class="rank-value">${r.conversions}건</span>
    </div>
  `).join("");

  const withCpa = rows.filter(r => r.conversions > 0).map(r => ({ ...r, cpa: r.cost / r.conversions }));
  const byCpa = [...withCpa].sort((a, b) => a.cpa - b.cpa);
  const maxCpa = Math.max(...byCpa.map(r => r.cpa), 1);
  document.getElementById("cpaRank").innerHTML = byCpa.map((r, i) => `
    <div class="rank-row">
      <span class="rank-num">${i + 1}</span>
      <span class="rank-name">${r.channel}</span>
      <div class="rank-bar"><div class="rank-bar-fill" style="width:${(r.cpa / maxCpa * 100).toFixed(1)}%"></div></div>
      <span class="rank-value">${won(r.cpa)}원</span>
    </div>
  `).join("");

  document.getElementById("channelTable").innerHTML = `
    <table>
      <thead><tr><th>채널</th><th>유입</th><th>광고비</th><th>전환</th><th>전환율</th><th>매출</th><th>ROAS</th></tr></thead>
      <tbody>
        ${rows.map(r => `<tr><td>${r.channel}</td><td>${Number(r.visitors).toLocaleString()}</td><td>${won(r.cost)}</td><td>${r.conversions}</td><td>${pct(r.conversions / r.visitors)}</td><td>${won(r.revenue)}</td><td>${r.cost ? (r.revenue / r.cost).toFixed(1) + "x" : "-"}</td></tr>`).join("")}
      </tbody>
    </table>
  `;
}

main();
</script>
</body>
</html>
