<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>송파점 고객 대시보드</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root {
    --accent: #14b8a6;
    --accent-soft: rgba(20,184,166,0.16);
    --bg: #0b0b0f;
    --sidebar-bg: #111116;
    --card-bg: #16161d;
    --card-border: rgba(255,255,255,0.07);
    --text-primary: #f5f5f7;
    --text-secondary: #9a9aa5;
    --text-muted: #6b6b76;
    --grid: rgba(255,255,255,0.08);
    --good: #22c55e;
    --bad: #ef4444;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text-primary); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing:antialiased; }
  .app { display: flex; min-height: 100vh; }
  .sidebar { width: 220px; flex-shrink: 0; background: var(--sidebar-bg); border-right: 1px solid var(--card-border); padding: 20px 14px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 6px 8px 20px; }
  .brand-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
  .brand-title { font-size: 14px; font-weight: 700; }
  .brand-sub { font-size: 10px; color: var(--text-muted); letter-spacing: 0.05em; }
  .nav-label { font-size: 10px; color: var(--text-muted); padding: 14px 8px 6px; letter-spacing: 0.05em; }
  .nav-item { display: block; padding: 8px 8px; border-radius: 8px; color: var(--text-secondary); text-decoration: none; font-size: 13px; margin-bottom: 2px; }
  .nav-item:hover { background: rgba(255,255,255,0.04); color: var(--text-primary); }
  .nav-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .sidebar-footer { margin-top: auto; padding: 12px 8px; font-size: 12px; color: var(--text-muted); border-top: 1px solid var(--card-border); }
  .content { flex: 1; padding: 28px 32px 60px; max-width: 1220px; }
  .content-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 22px; }
  .content-header h1 { font-size: 20px; margin: 0 0 4px; }
  .content-header .sub { color: var(--text-secondary); font-size: 13px; }
  .live-badge { font-size: 11px; color: var(--good); background: rgba(34,197,94,0.12); padding: 4px 10px; border-radius: 20px; }
  .badge-warn { font-size: 11px; color: var(--accent); background: var(--accent-soft); padding: 4px 10px; border-radius: 20px; margin-left: 8px; }
  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .kpi { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; padding: 18px; }
  .kpi-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .kpi-label { font-size: 12px; color: var(--text-secondary); }
  .kpi-badge { font-size: 10px; color: var(--accent); background: var(--accent-soft); padding: 2px 8px; border-radius: 10px; }
  .kpi-value { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
  .kpi-unit { font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-left: 3px; }
  .kpi-sub { font-size: 12px; color: var(--text-muted); margin-top: 6px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1.3fr; gap: 14px; margin-bottom: 20px; }
  @media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }
  .panel { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; padding: 20px; }
  .panel h2 { font-size: 13px; font-weight: 600; margin: 0 0 16px; color: var(--text-secondary); display: flex; justify-content: space-between; }
  .panel h2 .tag { font-size: 11px; color: var(--text-muted); font-weight: 400; }
  .donut-wrap { display: flex; align-items: center; gap: 18px; justify-content: center; padding: 10px 0; }
  .donut-legend { font-size: 12px; }
  .donut-legend-row { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .donut-legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .donut-legend-val { color: var(--text-muted); margin-left: auto; padding-left: 10px; }
  .rank-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--grid); font-size: 13px; }
  .rank-row:last-child { border-bottom: none; }
  .rank-num { width: 20px; height: 20px; border-radius: 6px; background: rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--text-secondary); flex-shrink: 0; }
  .rank-row:first-child .rank-num { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
  .rank-name { width: 150px; flex-shrink: 0; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank-bar { flex: 1; height: 6px; background: rgba(255,255,255,0.06); border-radius: 4px; overflow: hidden; }
  .rank-bar-fill { height: 100%; background: var(--accent); border-radius: 4px; }
  .rank-value { width: 100px; text-align: right; font-weight: 600; flex-shrink: 0; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: right; padding: 9px 8px; border-bottom: 1px solid var(--grid); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--text-muted); font-weight: 500; font-size: 12px; }
  .loading, .error { color: var(--text-muted); font-size: 13px; padding: 30px; text-align: center; }
  .error { color: var(--bad); }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-dot"></span>
      <div><div class="brand-title">고객관리</div><div class="brand-sub">CUSTOMER</div></div>
    </div>
    <div class="nav-label">현황</div>
    <a class="nav-item active" href="/customer">대시보드</a>
    <div class="nav-label">다른 대시보드</div>
    <a class="nav-item" href="/">영업</a>
    <a class="nav-item" href="/pl">손익</a>
    <a class="nav-item" href="/marketing">마케팅</a>
    <a class="nav-item" href="/hr">인사</a>
    <a class="nav-item" href="/exec">경영</a>
    <div class="sidebar-footer">송파점</div>
  </aside>

  <main class="content">
    <div class="content-header">
      <div>
        <h1>고객 대시보드</h1>
        <div class="sub" id="subtitle">불러오는 중...</div>
      </div>
      <div><span class="live-badge">● LIVE</span><span class="badge-warn">샘플 데이터</span></div>
    </div>

    <div class="kpi-row" id="kpiRow"><div class="loading">불러오는 중...</div></div>

    <div class="grid-2">
      <div class="panel">
        <h2>등급별 매출 비중</h2>
        <div id="donutChart"><div class="loading">불러오는 중...</div></div>
      </div>
      <div class="panel">
        <h2>등급별 매출 순위</h2>
        <div id="segRank"><div class="loading">불러오는 중...</div></div>
      </div>
    </div>

    <div class="panel">
      <h2>등급별 상세</h2>
      <div id="segTable"><div class="loading">불러오는 중...</div></div>
    </div>
  </main>
</div>

<script>
const sb = supabase.createClient("https://gqmhzvpcurrlkobsgcov.supabase.co", "sb_publishable_f1qmdqH6SgUYfVRanU1tbQ_hTpjHJ_G");
const won = n => Math.round(n).toLocaleString("ko-KR");
const pct = n => (n * 100).toFixed(1) + "%";
const PALETTE = ["#14b8a6", "#3b82f6", "#a855f7"];

async function main() {
  try {
    const { data, error } = await sb.from("customer_segment").select("*").order("sort_order");
    if (error) throw error;
    render(data);
  } catch (e) {
    document.getElementById("kpiRow").innerHTML = `<div class="error">데이터를 불러오지 못했습니다: ${e.message || e}</div>`;
    console.error(e);
  }
}

function render(rows) {
  const totalCustomers = rows.reduce((s, r) => s + Number(r.customer_count), 0);
  const totalRevenue = rows.reduce((s, r) => s + Number(r.revenue), 0);
  const avgOrder = Math.round(rows.reduce((s, r) => s + Number(r.avg_order) * Number(r.customer_count), 0) / totalCustomers);
  const returningCount = rows.filter(r => !r.segment.includes("일반")).reduce((s, r) => s + Number(r.customer_count), 0);

  document.getElementById("subtitle").textContent = "전체 고객 세그먼트 · 실시간 집계";

  document.getElementById("kpiRow").innerHTML = `
    <div class="kpi">
      <div class="kpi-top"><span class="kpi-label">총 고객수</span><span class="kpi-badge">전체</span></div>
      <div class="kpi-value">${totalCustomers.toLocaleString()}<span class="kpi-unit">명</span></div>
      <div class="kpi-sub">재구매(단골+VIP) ${pct(returningCount / totalCustomers)}</div>
    </div>
    <div class="kpi">
      <div class="kpi-top"><span class="kpi-label">총 매출</span><span class="kpi-badge">누적</span></div>
      <div class="kpi-value">${won(totalRevenue)}<span class="kpi-unit">원</span></div>
      <div class="kpi-sub">고객당 평균 ${won(totalRevenue / totalCustomers)}원</div>
    </div>
    <div class="kpi">
      <div class="kpi-top"><span class="kpi-label">평균 객단가</span><span class="kpi-badge">AOV</span></div>
      <div class="kpi-value">${won(avgOrder)}<span class="kpi-unit">원</span></div>
      <div class="kpi-sub">건당 평균 구매 금액</div>
    </div>
    <div class="kpi">
      <div class="kpi-top"><span class="kpi-label">VIP 매출비중</span><span class="kpi-badge">최상위</span></div>
      <div class="kpi-value">${pct(Number(rows[0].revenue) / totalRevenue)}</div>
      <div class="kpi-sub">${rows[0].customer_count}명이 매출 견인</div>
    </div>
  `;

  let angleAcc = 0;
  const segs = rows.map((r, i) => {
    const frac = Number(r.revenue) / totalRevenue;
    const seg = { start: angleAcc, len: frac * 360, color: PALETTE[i % PALETTE.length], label: r.segment, val: r.revenue };
    angleAcc += frac * 360;
    return seg;
  });
  const r = 52, cx = 70, cy = 70;
  const arc = (start, len) => {
    const a1 = (start - 90) * Math.PI / 180, a2 = (start + len - 90) * Math.PI / 180;
    const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
    const x2 = cx + r * Math.cos(a2), y2 = cy + r * Math.sin(a2);
    const large = len > 180 ? 1 : 0;
    return `M${cx},${cy} L${x1.toFixed(2)},${y1.toFixed(2)} A${r},${r} 0 ${large} 1 ${x2.toFixed(2)},${y2.toFixed(2)} Z`;
  };
  document.getElementById("donutChart").innerHTML = `
    <div class="donut-wrap">
      <svg width="140" height="140" viewBox="0 0 140 140">
        ${segs.map(s => `<path d="${arc(s.start, s.len)}" fill="${s.color}"/>`).join("")}
        <circle cx="70" cy="70" r="30" fill="var(--card-bg)"/>
      </svg>
      <div class="donut-legend">
        ${segs.map(s => `
          <div class="donut-legend-row">
            <span class="donut-legend-dot" style="background:${s.color}"></span>
            ${s.label} <span class="donut-legend-val">${pct(s.val / totalRevenue)}</span>
          </div>
        `).join("")}
      </div>
    </div>
  `;

  const maxRev = Math.max(...rows.map(r => Number(r.revenue)));
  document.getElementById("segRank").innerHTML = rows.map((r, i) => `
    <div class="rank-row">
      <span class="rank-num">${i + 1}</span>
      <span class="rank-name">${r.segment}</span>
      <div class="rank-bar"><div class="rank-bar-fill" style="width:${(r.revenue / maxRev * 100).toFixed(1)}%"></div></div>
      <span class="rank-value">${won(r.revenue)}원</span>
    </div>
  `).join("");

  document.getElementById("segTable").innerHTML = `
    <table>
      <thead><tr><th>등급</th><th>고객수</th><th>매출</th><th>매출비중</th><th>평균객단가</th></tr></thead>
      <tbody>
        ${rows.map(r => `<tr><td>${r.segment}</td><td>${Number(r.customer_count).toLocaleString()}</td><td>${won(r.revenue)}</td><td>${pct(Number(r.revenue) / totalRevenue)}</td><td>${won(r.avg_order)}</td></tr>`).join("")}
      </tbody>
    </table>
  `;
}

main();
</script>
</body>
</html>
