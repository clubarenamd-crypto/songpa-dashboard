<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>송파점 인사 대시보드</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root {
    color-scheme: light;
    --surface-1:#fcfcfb; --surface-2:#f2f1ee; --page:#f9f9f7;
    --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#898781;
    --grid:#e1e0d9; --border:rgba(11,11,11,0.10);
    --good:#0ca30c; --bad:#d03b3b;
    --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a; --series-4:#eda100;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface-1:#1a1a19; --surface-2:#232322; --page:#0d0d0d;
      --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#898781;
      --grid:#2c2c2a; --border:rgba(255,255,255,0.10);
      --good:#0ca30c; --bad:#e66767;
      --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --series-4:#c98500;
    }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--page); color:var(--text-primary); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 28px 20px 60px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--text-secondary); font-size: 13px; margin-bottom: 8px; }
  .badge { display:inline-block; font-size:11px; color:var(--text-muted); background:var(--surface-2); border-radius:4px; padding:2px 8px; margin-bottom:24px; }
  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 28px; }
  .kpi { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .kpi .label { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
  .kpi .value { font-size: 20px; font-weight: 700; }
  section { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 20px; }
  section h2 { font-size: 15px; margin: 0 0 14px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--grid); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--text-muted); font-weight: 500; }
  .loading, .error { color: var(--text-muted); font-size: 13px; padding: 20px; text-align: center; }
  .error { color: var(--bad); }
  .nav { font-size: 13px; margin-bottom: 16px; }
  .nav a { color: var(--text-secondary); text-decoration: none; margin-right: 12px; }
  .nav a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="wrap">
  <div class="nav"><a href="/">영업</a><a href="/pl">손익</a><a href="/marketing">마케팅</a><a href="/customer">고객</a><a href="/hr">인사</a></div>
  <h1>👥 송파점 인사 대시보드</h1>
  <div class="sub">판매자별 실적(실제 7월 데이터) · 출근율(샘플)</div>
  <div class="badge">⚠ 출근율은 샘플 데이터입니다</div>

  <div class="kpi-row" id="kpiRow"><div class="loading">불러오는 중...</div></div>

  <section>
    <h2>직원별 실적 · 출근율</h2>
    <div id="staffTable"><div class="loading">불러오는 중...</div></div>
  </section>
</div>

<script>
const sb = supabase.createClient("https://gqmhzvpcurrlkobsgcov.supabase.co", "sb_publishable_f1qmdqH6SgUYfVRanU1tbQ_hTpjHJ_G");
const won = n => "₩" + Math.round(n).toLocaleString("ko-KR");
const pct = n => (n * 100).toFixed(1) + "%";

async function main() {
  try {
    const { data, error } = await sb.from("hr_staff").select("*").order("sort_order");
    if (error) throw error;
    render(data);
  } catch (e) {
    document.getElementById("kpiRow").innerHTML = `<div class="error">데이터를 불러오지 못했습니다: ${e.message || e}</div>`;
    console.error(e);
  }
}

function render(rows) {
  const totalStaff = rows.length;
  const totalRevenue = rows.reduce((s, r) => s + Number(r.monthly_revenue), 0);
  const avgAttendance = rows.reduce((s, r) => s + Number(r.attendance_rate), 0) / totalStaff;

  document.getElementById("kpiRow").innerHTML = `
    <div class="kpi"><div class="label">재직 인원</div><div class="value">${totalStaff}명</div></div>
    <div class="kpi"><div class="label">평균 출근율</div><div class="value">${pct(avgAttendance)}</div></div>
    <div class="kpi"><div class="label">인당 평균 매출</div><div class="value">${won(totalRevenue / totalStaff)}</div></div>
  `;

  document.getElementById("staffTable").innerHTML = `
    <table>
      <thead><tr><th>이름</th><th>역할</th><th>매출</th><th>마진</th><th>출근율</th></tr></thead>
      <tbody>
        ${rows.map(r => `<tr><td>${r.name}</td><td>${r.role}</td><td>${won(r.monthly_revenue)}</td><td>${won(r.monthly_margin)}</td><td>${pct(r.attendance_rate)}</td></tr>`).join("")}
      </tbody>
    </table>
  `;
}

main();
</script>
</body>
</html>
